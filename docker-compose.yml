services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
      DJANGO_POSTGRES_DB: ${POSTGRES_DB}
      DJANGO_POSTGRES_USER: ${POSTGRES_USER}
      DJANGO_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_POSTGRES_HOST: ${POSTGRES_HOST}
      DJANGO_POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  worker:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "cafe", "worker", "-l", "info"]
    env_file: .env
    environment:
      DJANGO_POSTGRES_DB: ${POSTGRES_DB}
      DJANGO_POSTGRES_USER: ${POSTGRES_USER}
      DJANGO_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_POSTGRES_HOST: ${POSTGRES_HOST}
      DJANGO_POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
